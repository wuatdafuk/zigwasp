# LPSTK-CC1352R driven by a standalone XDS110 pod over an ARM Cortex-M 10-pin cable.
#
# NOTE: the LPSTK must be self-powered (2xAAA, coin cell, or a bench supply on the
# battery terminals). Pin 1 of the 10-pin cable is VTREF -- a sense input, not a
# supply -- so the pod cannot power the board.
#
# Requires the patched /usr/local/bin/openocd: stock OpenOCD aborts init because
# this pod rejects XDS_SET_SUPPLY (0x32, error -267).

source [find interface/xds110.cfg]
adapter serial 55858007
transport select jtag
adapter speed 1000

# Use the hardware reset line, NOT vectreset.
#
# TI's ti_cc13x2.cfg selects "cortex_m reset_config vectreset", which resets only
# the CPU core and leaves the oscillator and power domains untouched. If firmware
# wedges the 48 MHz oscillator (e.g. TI's oscillatorISR storming on IRQ 34), every
# subsequent warm reset inherits that wedged state and the radio never starts --
# it looks exactly like a dead board. Asserting nRESET gives a clean power-on-like
# reset so each boot starts from a sane clock state.
reset_config srst_only srst_nogate connect_deassert_srst
adapter srst delay 100
adapter srst pulse_width 100

source [find target/ti_cc13x2.cfg]

# ti_cc13x2.cfg sets vectreset; override it after sourcing.
cortex_m reset_config sysresetreq

# Plain "jtag arp_init" interrogates without firing the jrc tap's post-reset
# event, so the cJTAG-to-4-pin escape never runs. arp_init-reset resets first.
proc jtag_init {} {
	jtag arp_init-reset
}
