# LPSTK-CC1352R driven by a standalone XDS110 pod over an ARM Cortex-M 10-pin cable.
#
# NOTE: the LPSTK must be self-powered (2xAAA or a soldered CR2032). Pin 1 of the
# 10-pin cable is VTREF -- a sense input, not a supply -- so the pod cannot power
# the board. With no power, every transport reports "all zeroes" with TDO stuck low.
#
# Requires the patched /usr/local/bin/openocd: stock OpenOCD aborts init because
# this pod rejects XDS_SET_SUPPLY (0x32, error -267).

source [find interface/xds110.cfg]
adapter serial 55858007
transport select jtag
adapter speed 1000

source [find target/ti_cc13x2.cfg]

# Plain "jtag arp_init" interrogates without firing the jrc tap's post-reset
# event, so the cJTAG-to-4-pin escape never runs. arp_init-reset resets first.
proc jtag_init {} {
	jtag arp_init-reset
}
