# Radio bring-up test for LPSTK-CC1352R.
#
# NOTE: not using CONFIG_IEEE802154_RAW_MODE -- the cc13xx driver calls
# net_recv_data() and ieee802154_handle_ack() unconditionally, so it does not
# link without the net core and the 802.15.4 L2. We enable the real L2 and
# simply drive the radio API directly from main().
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_NET_L2_IEEE802154=y

# 2.4 GHz only; the sub-GHz driver is a separate device we do not need.
CONFIG_IEEE802154_CC13XX_CC26XX_SUB_GHZ=n

CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=n
CONFIG_NET_UDP=n
CONFIG_NET_TCP=n
CONFIG_NET_CONFIG_AUTO_INIT=n

CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_BUF_DATA_SIZE=128

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_IEEE802154_DRIVER_LOG_LEVEL_DBG=y

CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_MAIN_STACK_SIZE=2048

# The cc13xx TRNG driver interrupt-storms on this board: its ISR only ACKs
# TRNG_NUMBER_READY and TRNG_FRO_SHUTDOWN, so any other status bit re-fires
# forever and starves every thread (main never runs). Not needed here.
CONFIG_ENTROPY_CC13XX_CC26XX_RNG=n

# The board defconfig enables the ROM bootloader backdoor on DIO15 (active low).
# If DIO15 sits low at reset the ROM traps into the serial bootloader and the
# application never runs -- observed here as PC parked at a fixed early-ROM
# address with no console output. We don't need the backdoor.
CONFIG_CC13X2_CC26X2_BOOTLOADER_BACKDOOR_ENABLE=n
CONFIG_CC13X2_CC26X2_BOOTLOADER_ENABLE=n
