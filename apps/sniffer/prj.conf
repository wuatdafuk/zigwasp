# zigwasp 802.15.4 sniffer for LPSTK-CC1352R.
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_NET_L2_IEEE802154=y
CONFIG_NET_PROMISCUOUS_MODE=y

# 2.4 GHz only.
CONFIG_IEEE802154_CC13XX_CC26XX_SUB_GHZ=n

CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=n
CONFIG_NET_UDP=n
CONFIG_NET_TCP=n
CONFIG_NET_CONFIG_AUTO_INIT=n

# Plenty of buffers: a busy channel bursts hard.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_DATA_SIZE=128

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y

# The cc13xx TRNG driver interrupt-storms on this board (ISR only ACKs two
# status bits); it starves every thread. Not needed here.
CONFIG_ENTROPY_CC13XX_CC26XX_RNG=n

# Board defconfig enables the ROM bootloader backdoor on DIO15 (active low).
CONFIG_CC13X2_CC26X2_BOOTLOADER_BACKDOOR_ENABLE=n
CONFIG_CC13X2_CC26X2_BOOTLOADER_ENABLE=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG=n

# Software RNG: the L2 and driver call sys_rand_get(), and we disabled the
# hardware TRNG above. A sniffer never transmits, so non-crypto RNG is fine.
CONFIG_TEST_RANDOM_GENERATOR=y

# Zephyr's promisc_mode_set() in subsys/net/ip/net_if.c returns -ENOTSUP
# unconditionally when CONFIG_NET_L2_ETHERNET is not built -- the promiscuous
# API is Ethernet-gated regardless of what the L2 advertises. With Ethernet L2
# compiled in, the "is this iface Ethernet?" test is simply false for our
# 802.15.4 interface and the function falls through to success. We never create
# an Ethernet interface; this only satisfies the #if.
CONFIG_NET_L2_ETHERNET=y

# Keep the FCS in delivered frames. The cc13xx driver strips the 2-byte FCS
# unless this is set, but we emit PCAP as DLT 195 (IEEE802_15_4_WITHFCS), so
# Wireshark would read the last two payload bytes as the FCS and report
# "Bad FCS" plus malformed dissection on every frame.
CONFIG_IEEE802154_L2_PKT_INCL_FCS=y

# No power management. The CC1352R idles into deep standby, which powers down
# XOSC_HF; a disturbed standby/wake transition (e.g. a JTAG halt landing in it)
# wedges the oscillator state machine, and TI's oscillatorISR then storms on
# IRQ 34 forever -- surviving warm resets AND an AON_PMCTL SYSRESET, clearing
# only on a real power cycle. A sniffer must listen continuously anyway, so
# standby buys us nothing.
CONFIG_PM=n
